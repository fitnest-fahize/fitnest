<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 Page Not Found — FitNest</title>
    <link rel="icon" type="image/png" href="images/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: 'Inter', sans-serif;
        margin: 0;
      }
      h1, h2 {
        font-family: 'Montserrat', sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="min-h-screen flex items-center justify-center" style="background: linear-gradient(to bottom right, #16a34a, #15803d)">
      <div class="container mx-auto px-4 max-w-2xl text-center">
        <div class="space-y-8">
          <div class="space-y-4">
            <h1 class="text-7xl sm:text-8xl font-black text-white/95 tracking-tight">404</h1>
            <h2 class="text-3xl font-bold text-white/95">
              Page Not Found
            </h2>
            <p class="text-white/80 text-lg max-w-md mx-auto">
              Sorry, the page you're looking for doesn't exist or has been moved.
            </p>
          </div>

          <div class="flex flex-col sm:flex-row justify-center gap-4 pt-4">
            <a href="index.html">
              <button class="w-full sm:w-auto px-8 py-3.5 bg-white text-emerald-700 font-bold rounded-full shadow-xl hover:shadow-2xl transition-all hover:scale-105">
                🏠 Go Home
              </button>
            </a>
            <button
              onclick="window.history.back()"
              class="w-full sm:w-auto px-8 py-3.5 bg-emerald-800/60 border border-white/20 text-white font-bold rounded-full shadow-lg hover:shadow-xl transition-all hover:scale-105"
            >
              ← Go Back
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
